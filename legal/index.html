<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Redirigiendo...</title>
    <script>
        (function() {
            let lang = 'es';
            try {
                const saved = localStorage.getItem('geoRoot_preferred_lang');
                if (saved) lang = saved;
            } catch(e) {}
            window.location.href = lang + '.html';
        })();
    </script>
</head>
<body>
    <p>Redirigiendo...</p>
</body>
</html>
